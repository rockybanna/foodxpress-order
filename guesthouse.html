<!DOCTYPE html>

<style>
  :root{
--brand:#e53935;
--brand-soft:#fdecea;
    --bg:#ffffff;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6f6f6f;
  --border:#e4e4e4;
}

/* RESET */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* PAGE */
.page{
  display:none;
  min-height:100vh;
  width:100%;
}
.page.active{
  display:block !important;
}


/* ================= APP CONTAINER (REAL APP EXPERIENCE) ================= */
@media (min-width:768px){
  .page{
    max-width:420px;
    margin:16px auto;
    background:#fff;

    /* Visible rounded rectangle */
    border-radius:22px;
    border:2px solid #d6d6d6;

    /* Premium app shadow */

      0 20px 48px rgba(0,0,0,.25),

  }
}

/* HEADER (HOME) */
.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#000;
}
.header img{
  width:100%;
  max-height:150px;
  object-fit:cover;

}

/* BACK BUTTON */
.topbar{

.sticky-stack{
  position: sticky;
  top: 56px;
  z-index: 1000;
  background: #fff;

  margin-top: -1px; /* 🔥 removes visual gap */
}
  
  /* SEARCH BAR – FIXED OVERLAP */

/* SPACE BELOW SEARCH BAR */
#restaurantList{

/* RESTAURANT CARD */

  /* CATEGORY */
.item,.cart-item{

  justify-content:space-between;

  gap:12px;
  background:#fff;
  padding:16px;

}

}
.item-desc{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;

}
.small{

}

/* QTY */
.qty{

}
.qty button{

}

}

/* CART BAR */
.cart-bar{

  bottom:12px;
  left:12px;
  right:12px;

/* BILL */

  justify-content:space-between;

}
.bill .total{

}

/* BUTTON */
button.primary{

  background:var(--brand);
  color:#fff;

  font-weight:800;

}

/* CATEGORY POPUP */
.cat-btn{

  right:16px;

  background:#2f2f2f;
  color:#fff;
  padding:12px 18px;

}
.cat-popup{

}
.cat-box{
  background:#fff;
  margin:0 auto;
  width:82%;
  max-height:70vh;
  overflow-y:auto;
  border-radius:20px;
  padding:14px;

  position:relative;
  top:90px;   /* 🔑 pushes popup below header */
}
.cat-box div{
  padding:14px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}

  .cat-chip.active{
  background:#e53935;
  color:#fff;
}
  
/* INPUTS */
input,textarea{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid var(--border);
  font-size:15px;
}

/* 🔴 HOVER EFFECT (ADD THIS EXACTLY HERE) */
.restaurant:hover,
.item:hover{
  border-color:#e53935;
}
  
</style>

<script>
  
/* ================= DATA ================= */
let restaurants=[],categories=[],items=[],guesthouses=[];
let selectedGuestHouse=null;
let guestHouseId="";
  
let ALL_RESTAURANTS = [];
let cart={},currentRestaurant="",stack=["page-restaurants"];
let lat="",lng="",mapLink="";
let pricedDistanceKm = 0;
let orderId = "";
let platformFee = 5;
  
/* ================= DOM READY (PWA SAFE) ================= */

let restaurantList,
menuItems,
cartBar,
cartInfo,
menuTitle,
custName,
custPhone,
custAddress;
  
document.addEventListener("DOMContentLoaded", () => {


  /* ---------- DOM REFERENCES ---------- */
  restaurantList = document.getElementById("restaurantList");
  menuItems = document.getElementById("menuItems");
  cartBar = document.getElementById("cartBar");
  cartInfo = document.getElementById("cartInfo");
  menuTitle = document.getElementById("menuTitle");
  custName = document.getElementById("custName");
  custPhone = document.getElementById("custPhone");
  custAddress = document.getElementById("custAddress");

  /* ---------- FETCH DATA AFTER DOM READY ---------- */
  fetch("https://script.google.com/macros/s/AKfycbw66W91wIe-cAXwIZPgfEGJ1gy4TQ_MQ5WANbm3jQ9g4t_OmKNgqD7K8-pq7njoteWwEg/exec")
    .then(r => r.json())
    .then(d => {

restaurants = d.restaurants.map(r => ({
  id: r.RestaurantID,
  name: r.RestaurantName,
  logo: `images/restaurants/${r.RestaurantID}.jpg`,
  lat: Number(r.Latitude),
  lng: Number(r.Longitude),
  slots: [
    [r.Slot1_Open, r.Slot1_Close],
    [r.Slot2_Open, r.Slot2_Close]
  ]
  .filter(x => x[0] && x[1])
  .map(x => [toTime(x[0]), toTime(x[1])])
}));

      ALL_RESTAURANTS = [...restaurants];
      categories = d.categories || [];
      items = d.items || [];
      guesthouses = d.guesthouses || [];

      guestHouseId =
  new URLSearchParams(window.location.search).get("gh") || "";

selectedGuestHouse =
  guesthouses.find(
    g => String(g.GuestHouseID) === String(guestHouseId)
  ) || null;

console.log("GuestHouse ID:", guestHouseId);
console.log("Selected GuestHouse:", selectedGuestHouse);
if(selectedGuestHouse){

  lat = Number(selectedGuestHouse.Latitude);
  lng = Number(selectedGuestHouse.Longitude);

  mapLink =
    `https://maps.google.com/?q=${lat},${lng}`;

  console.log("Guest House Location Loaded", lat, lng);
}
      
      renderRestaurants();
    })
    .catch(() => alert("Unable to connect"));
  orderId = getOrderId();

});


  /* ================= ORDER ID ================= */
function getOrderId(){
  let id = localStorage.getItem("fx_order_id");

  if(!id){
    const d = new Date();
    const rand = Math.floor(100 + Math.random() * 900);

    id =
      "FX-" +
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, "0") +
      String(d.getDate()).padStart(2, "0") +
      "-" +
      String(d.getHours()).padStart(2, "0") +
      String(d.getMinutes()).padStart(2, "0") +
      String(d.getSeconds()).padStart(2, "0") +
      "-" +
      rand;

    localStorage.setItem("fx_order_id", id);
  }

  return id;
}

/* ---------- TIME FORMATTER ---------- */
function toTime(v) {
  if (!v) return "";
  const d = new Date(v);
  const h = d.getHours().toString().padStart(2, "0");
  const m = d.getMinutes().toString().padStart(2, "0");
  return `${h}:${m}`;
}

  /* ================= DISTANCE (HAVERSINE) ================= */
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371; // Earth radius in KM
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return +(R * c).toFixed(2);
}
  
  /* ================= DISTANCE NORMALIZATION ================= */
function normalizeDistanceForPricing(km){
  if(km <= 1.5) return 1.5;
  if(km <= 2.5) return 2.5;
  if(km <= 3.5) return 3.5;
  if(km <= 4.5) return 4.5;
  if(km <= 5.5) return 5.5;
  if(km <= 6.5) return 6.5;
  return km; // above 6.5 km stays as-is for now
}

  /* ================= BASE DELIVERY (NO DISCOUNT) ================= */
function baseDeliveryFromDistance(km){
  if(km > 15){
    return { blocked: true, charge: 0 };
  }

  // Rule 1: up to 6.5 km
  if(km <= 6.5){
    return { blocked: false, charge: 20 + (10 * km) };
  }

  // Rule 2: above 6.5 km
  return { blocked: false, charge: 30 + (10 * km) };
}

  function recalculateDistance(){

  if(!lat || !lng || !currentRestaurant){
    return;
  }

  const rest = restaurants.find(r => String(r.id) === String(currentRestaurant));
  if(!rest || !rest.lat || !rest.lng){
    return;
  }

  const rawDist = haversineKm(rest.lat, rest.lng, lat, lng);
  const dist = +(rawDist * 1.5).toFixed(2);
  const pricedDist = normalizeDistanceForPricing(dist);

  if(pricedDist > 20){
    pricedDistanceKm = 0;
    return;
  }

  pricedDistanceKm = pricedDist;
}
    
/* ================= FINAL DELIVERY ================= */
function finalDeliveryCharge(pricedKm){

  const base = baseDeliveryFromDistance(pricedKm);

  if(base.blocked){
    return { blocked:true, charge:0 };
  }

  return {
    blocked:false,
    charge:Math.round(base.charge)
  };
}
  
/* ================= TIME ================= */
function toMin(t){const[a,b]=t.split(":").map(Number);return a*60+b}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function status(r){
 const n=nowMin();
 for(const s of r.slots){
  if(n>=toMin(s[0])&&n<=toMin(s[1]))return{open:true,closes:s[1]};
  if(n<toMin(s[0]))return{open:false,opens:s[0]};
 }
 return{open:false,opens:r.slots[0][0]};
}

/* ================= NAV ================= */
function show(p){

  // 🔴 HIDE ALL PAGES FORCEFULLY
  document.querySelectorAll(".page").forEach(el => {
    el.style.display = "none";
    el.classList.remove("active");
  });

  // 🟢 SHOW ONLY TARGET PAGE
  const target = document.getElementById(p);

  if(!target){
    alert("PAGE NOT FOUND: " + p);
    return;
  }

  target.style.display = "block";
  target.classList.add("active");
}

function nav(p){
  stack.push(p);
  show(p);

  // 🔥 sync with browser history
  history.pushState({ page: p }, "", "");
}

  window.onpopstate = function(){

  if(stack.length > 1){
    stack.pop();
    show(stack.at(-1));
  } else {
    // if already at first page → allow exit
    history.back();
  }
};
    
function goBack(){
  history.back();  // 🔥 trigger browser back instead
}
  
function backToRestaurants(){
  cart = {};
  updateBar();

  lat = "";
  lng = "";
  pricedDistanceKm = 0;
  mapLink = "";

  stack = ["page-restaurants"];
  show("page-restaurants");
}

  /* 🔒 LOGIC LOCK — RESTAURANT SHUFFLE (SAFE) */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* ================= RESTAURANTS ================= */
function filterRestaurants(query){
  query = query.toLowerCase().trim();

  if(!query){
    restaurants = [...ALL_RESTAURANTS];
    renderRestaurants();
    return;
  }

  const byName = ALL_RESTAURANTS.filter(r =>
    r.name.toLowerCase().includes(query)
  );

  const matchedRestaurantIds = new Set(
    (items || [])
      .filter(i => i.ItemName && i.ItemName.toLowerCase().includes(query))
      .map(i => String(i.RestaurantID))
  );

  const byItems = ALL_RESTAURANTS.filter(r =>
    matchedRestaurantIds.has(String(r.id))
  );

  // merge + remove duplicates
  restaurants = [
    ...new Map(
      [...byName, ...byItems].map(r => [String(r.id), r])
    ).values()
  ];

  renderRestaurants();
}

function renderRestaurants(){
  restaurantList.innerHTML = "";

  const openList = [];
  const closedList = [];

  // shuffle safely
  const shuffled = [...(restaurants || [])];
  shuffle(shuffled);

  shuffled.forEach(r => {

    if(!r) return;

    const s = status(r);
    const d = document.createElement("div");

    d.className = "restaurant " + (s.open ? "open" : "closed");

    d.innerHTML = `
      <img src="${r.logo}" onerror="this.src='company-logo.png'">
      <div class="rest-info">
        <div class="rest-name">${r.name}</div>
        <div class="rest-status ${s.open ? "open-text" : "closed-text"}">
          ${s.open ? "Open • Closes " + s.closes : "Closed • Opens " + s.opens}
        </div>
      </div>
    `;

    // ✅ FINAL CLICK FIX (ID based)
    d.addEventListener("click", function(e){
  e.stopPropagation();
  openMenu(r.id);
});

    (s.open ? openList : closedList).push(d);
  });

  [...openList, ...closedList].forEach(el => restaurantList.appendChild(el));
}


/* ================= MENU ================= */
function openMenu(id){

  cart = {};
  currentRestaurant = id;

  if(selectedGuestHouse){
    lat = Number(selectedGuestHouse.Latitude);
    lng = Number(selectedGuestHouse.Longitude);
  }

  recalculateDistance();
  
  const rest = restaurants.find(r => String(r.id) === String(id));
  if(!rest) return;

  menuTitle.innerText = rest.name;

  // ✅ OPEN PAGE
  nav("page-menu");
window.onscroll = handleCategoryHighlight;
  
  // ✅ WAIT UNTIL DOM IS READY (STRONGER THAN setTimeout)
  requestAnimationFrame(() => {
    renderMenu();
  });
}

function renderMenu(){
  menuItems.innerHTML = "";
  const categoryBar = document.getElementById("categoryBar");
categoryBar.innerHTML = "";

  const rest = restaurants.find(r => String(r.id) === String(currentRestaurant));
  if(!rest) return;

  const restCats = (categories || [])
    .filter(c =>
      String(c.RestaurantID) === String(rest.id) &&
      (c.IsActive === true || c.IsActive === "TRUE")
    )
    .sort((a,b) => (a.SortOrder||0) - (b.SortOrder||0));

  restCats.forEach(cat => {

categoryBar.innerHTML += `
  <span class="cat-chip" onclick="scrollToCat('${cat.CategoryID}')">
    ${cat.CategoryName}
  </span>
`;
    
    menuItems.innerHTML += `
      <div class="category" id="cat-${cat.CategoryID}">
        ${cat.CategoryName}
      </div>
    `;

    (items || [])
      .filter(i =>
        String(i.RestaurantID) === String(rest.id) &&
        String(i.CategoryID) === String(cat.CategoryID) &&
        i.IsAvailable
      )
      .forEach(it => {

        const q = cart[it.ItemName] || 0;

        menuItems.innerHTML += `
          <div class="item">
            <div>
              <div class="item-name">${it.ItemName}</div>
              ${it.ItemDescription ? `<div class="item-desc">${it.ItemDescription}</div>` : ""}
              <div class="small">₹${it.Price}</div>
            </div>
            <div class="qty">
              <button onclick="upd('${it.ItemName}', 0, -1)">−</button>
              <span>${q}</span>
              <button onclick="upd('${it.ItemName}', 0, 1)">+</button>
            </div>
          </div>
        `;
      });

  });

  updateBar();
}

function scrollToCat(catId){
  const el = document.getElementById("cat-" + catId);
  if(el){
const stickyEl = document.querySelector(".sticky-stack");
const stickyHeight = stickyEl ? stickyEl.offsetHeight : 0;
    const y = el.getBoundingClientRect().top + window.scrollY - stickyHeight - 10;
window.scrollTo({ top: y, behavior: "smooth" });

// 🔥 force immediate highlight update
setTimeout(handleCategoryHighlight, 100);
  }
}

function handleCategoryHighlight(){

  const categories = document.querySelectorAll(".category");
  const chips = document.querySelectorAll(".cat-chip");

  if(!categories.length) return;

  // 🔥 dynamic top offset (real height of sticky stack)
const stickyEl = document.querySelector(".sticky-stack");
const stickyHeight = stickyEl ? stickyEl.offsetHeight : 0;
  
  let activeIndex = 0;

  categories.forEach((cat, i) => {

    const rect = cat.getBoundingClientRect();

    // ✅ check when category crosses sticky area
    if(rect.top - stickyHeight <= 10){
      activeIndex = i;
    }

  });

  chips.forEach(c => c.classList.remove("active"));

if(chips[activeIndex]){
  const activeChip = chips[activeIndex];
  activeChip.classList.add("active");

  // 🔥 AUTO SCROLL CHIP INTO VIEW
  activeChip.scrollIntoView({
    behavior: "smooth",
    inline: "center",
    block: "nearest"
  });
}
}
  
/* ================= CART ================= */

function upd(itemName, priceIgnored, delta){
  cart[itemName] = (cart[itemName] || 0) + delta;
  if (cart[itemName] <= 0) delete cart[itemName];

  if (stack.at(-1) === "page-menu") renderMenu();
  // summary page removed
  updateBar();
}

function price(itemName){
  const rest = restaurants.find(r => String(r.id) === String(currentRestaurant));
  if (!rest) return 0;

  const it = items.find(
    i => String(i.RestaurantID) === String(rest.id) &&
         i.ItemName === itemName
  );

  return it ? Number(it.Price) : 0;
}

function updateBar(){
  let itemCount = 0, total = 0;

  for (const i in cart){
    itemCount += cart[i];
    total += cart[i] * price(i);
  }

  if (itemCount > 0 && stack.at(-1) === "page-menu"){
    cartBar.style.display = "flex";
    cartInfo.innerText =
      `${itemCount} items | ₹${total}`;
  } else {
    cartBar.style.display = "none";
  }
}

  function filterMenuItems(query){
  query = query.toLowerCase().trim();

  const allItems = document.querySelectorAll(".item");

  allItems.forEach(el => {
    const text = el.innerText.toLowerCase();
    el.style.display = text.includes(query) ? "flex" : "none";
  });
}

}

/* ================= PLACE ORDER ================= */
function placeOrder(){

  for(const i in cart){
    itemTotal += cart[i] * price(i);
  }

  if(itemTotal < 200){
    alert("Minimum order ₹200. Add more items to continue.");
    return;
  }    

  /* -------- VALIDATIONS -------- */
  const name = custName.value.trim();
  if(!/^[A-Za-z ]{5,25}$/.test(name)){
    alert("Please enter a valid full name");

  }

  const phone = custPhone.value.trim();
  if(!/^[0-9]{10}$/.test(phone)){
    alert("Please enter a valid 10-digit mobile number");
    return;
  }

const roomNumber = custAddress.value.trim();

if(roomNumber.length < 1){
  alert("Please enter room number");

}

const address =
  (selectedGuestHouse ? selectedGuestHouse.GuestHouseName : "Guest House")
  + "\nRoom: " + roomNumber;
  
const del = finalDeliveryCharge(pricedDistanceKm);
  
if(del.blocked){

const deliveryCharge = del.charge;

`;

`;
