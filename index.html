<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>20nagar Food Xpress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;font-family:sans-serif;background:#fff}

/* HEADER */
.header{
position:sticky;top:0;background:#fff;
display:flex;justify-content:space-between;
padding:12px;border-bottom:1px solid #ddd;
z-index:1000;
}

/* SEARCH */
.search{width:100%;padding:10px;margin:10px;border:1px solid #ddd;border-radius:10px}

/* CATEGORY */
.cat-wrap{position:sticky;top:100px;background:#fff;padding:8px;z-index:999}
.cat-scroll{display:flex;gap:8px;overflow-x:auto}
.cat{padding:6px 12px;background:#eee;border-radius:20px;font-size:12px}
.cat.active{background:#e53935;color:#fff}

/* ITEM */
.item{display:flex;justify-content:space-between;padding:10px;border:1px solid #ddd;margin:10px;border-radius:10px}

/* CART */
.cart{
position:fixed;bottom:10px;left:10px;right:10px;
background:#e53935;color:#fff;padding:12px;
border-radius:12px;display:none;justify-content:space-between;
}

/* SAVING */
.saving{position:sticky;top:60px;background:#fff;text-align:center;font-weight:bold}
.bar{height:6px;background:#eee;margin:5px}
.fill{height:100%;background:#e53935;width:0%}

/* MAP */
#map{height:100vh}
.map-btn{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#e53935;color:#fff;padding:12px;border-radius:10px;
}
</style>

</head>

<body>

<!-- HOME -->

<div id="home">
<div onclick="openMap()" style="padding:10px;border:1px solid #ddd;margin:10px;border-radius:10px">
📍 <span id="locText">Set location</span>
</div>

<input class="search" placeholder="Search restaurant..." oninput="searchRest(this.value)">
<div id="restList"></div>
</div>

<!-- MENU -->

<div id="menu" style="display:none">

<div class="header">
<div onclick="back()">←</div>
<div id="restName"></div>
<div onclick="openCart()">🛒</div>
</div>

<div class="saving" id="saving"></div>
<div class="bar"><div class="fill" id="fill"></div></div>

<input class="search" placeholder="Search items..." oninput="searchItems(this.value)">

<div class="cat-wrap">
<div id="cats" class="cat-scroll"></div>
</div>

<div id="items"></div>

<div id="cart" class="cart" onclick="openCart()">
<span id="cartText"></span>
<span>View</span>
</div>

</div>

<!-- MAP -->

<div id="mapPage" style="display:none">
<div id="map"></div>
<div class="map-btn" onclick="confirmLocation()">Confirm Location</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* DATA */
let restaurants=[],items=[],categories=[];
let currentRest="";
let cart={};
let lat=null,lng=null;

/* LOAD */
fetch("https://script.google.com/macros/s/AKfycbw66W91wIe-cAXwIZPgfEGJ1gy4TQ_MQ5WANbm3jQ9g4t_OmKNgqD7K8-pq7njoteWwEg/exec")
.then(r=>r.json())
.then(d=>{
restaurants=d.restaurants;
items=d.items;
categories=d.categories;
renderRestaurants();
});

/* HOME */
function renderRestaurants(){
restList.innerHTML="";
restaurants.forEach(r=>{
restList.innerHTML+=`<div onclick="openMenu('${r.RestaurantID}')"
style="padding:10px;border:1px solid #ddd;margin:10px;border-radius:10px">
${r.RestaurantName}</div>`;
});
}

/* MENU */
function openMenu(id){
currentRest=id;
home.style.display="none";
menu.style.display="block";

let r=restaurants.find(x=>x.RestaurantID==id);
restName.innerText=r.RestaurantName;

renderMenu();
}

function renderMenu(){

itemsDiv.innerHTML="";
cats.innerHTML="";

categories.filter(c=>c.RestaurantID==currentRest).forEach(c=>{
cats.innerHTML+=`<div class="cat" onclick="scrollCat('${c.CategoryID}')">${c.CategoryName}</div>`;
});

items.filter(i=>i.RestaurantID==currentRest).forEach(it=>{
items.innerHTML+=`<div class="item" id="cat-${it.CategoryID}">
${it.ItemName} ₹${it.Price}
<button onclick="add('${it.ItemName}')">+</button>
</div>`;
});

initScrollSpy();
}

/* SCROLL SPY */
function initScrollSpy(){
let secs=document.querySelectorAll(".item");
let obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
let id=e.target.id.replace("cat-","");
document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
let el=[...document.querySelectorAll(".cat")].find(x=>x.onclick.toString().includes(id));
if(el)el.classList.add("active");
}
});
},{threshold:0.5});
secs.forEach(s=>obs.observe(s));
}

/* CART */
function add(n){
cart[n]=(cart[n]||0)+1;
updateCart();
}

function updateCart(){
let c=0,t=0;
for(let i in cart){
c+=cart[i];
let it=items.find(x=>x.ItemName==i);
t+=it.Price*cart[i];
}
if(c){
cart.style.display="flex";
cartText.innerText=c+" items ₹"+t;
}
}

/* SEARCH */
function searchItems(q){
q=q.toLowerCase();
items.innerHTML="";
items.filter(i=>i.RestaurantID==currentRest && i.ItemName.toLowerCase().includes(q))
.forEach(it=>{
items.innerHTML+=`<div class="item">${it.ItemName} ₹${it.Price}</div>`;
});
}

/* MAP */
let map,marker;

function openMap(){
home.style.display="none";
mapPage.style.display="block";

map=L.map('map').setView([22.3,70.8],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click',e=>{
if(marker)map.removeLayer(marker);
marker=L.marker(e.latlng).addTo(map);
lat=e.latlng.lat;
lng=e.latlng.lng;
});
}

function confirmLocation(){
if(!lat){alert("Tap on map");return;}
locText.innerText="Location ✓";
mapPage.style.display="none";
home.style.display="block";
}

/* NAV */
function back(){
menu.style.display="none";
home.style.display="block";
}

</script>

</body>
</html>
