<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>20nagar Food Xpress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;font-family:sans-serif;background:#fff}

/* PAGE */
.page{display:none}
.page.active{display:block}

/* HEADER */
.header{
position:sticky;top:0;background:#fff;
display:flex;justify-content:space-between;
padding:12px;border-bottom:1px solid #ddd;
font-weight:700;z-index:1000;
}

/* OFFER */
.offer{
background:#e53935;color:#fff;padding:12px;
margin:10px;border-radius:10px;text-align:center;font-weight:700;
}

/* SEARCH */
.search{width:100%;padding:10px;margin:10px;border:1px solid #ddd;border-radius:10px}

/* CATEGORY */
.cat-wrap{position:sticky;top:60px;background:#fff;padding:8px}
.cat-scroll{display:flex;gap:8px;overflow-x:auto}
.cat{padding:6px 12px;background:#eee;border-radius:20px}
.cat.active{background:#e53935;color:#fff}

/* ITEM */
.item{display:flex;justify-content:space-between;padding:12px;border:1px solid #ddd;margin:10px;border-radius:10px}

/* CART */
.cart{
position:fixed;bottom:10px;left:10px;right:10px;
background:#e53935;color:#fff;padding:12px;
border-radius:12px;display:none;justify-content:space-between;
}

/* SAVING */
.saving{text-align:center;font-weight:700}
.bar{height:6px;background:#eee;margin:5px}
.fill{height:100%;background:#e53935;width:0%}

/* MAP */
#map{height:100vh}
.map-btn{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#e53935;color:#fff;padding:12px;border-radius:10px;
}
</style>

</head>

<body>

<!-- HOME -->

<div id="home" class="page active">

<div class="offer">
🔥 Delivery starts at ₹1<br>
📉 Lower charges on higher orders
</div>

<div onclick="openMap()" style="padding:10px;border:1px solid #ddd;margin:10px;border-radius:10px">
📍 <span id="locText">Set location</span>
</div>

<input class="search" placeholder="Search restaurant..." oninput="searchRest(this.value)">
<div id="restList"></div>

</div>

<!-- MENU -->

<div id="menu" class="page">

<div class="header">
<div onclick="back()">←</div>
<div id="restName"></div>
<div onclick="openCart()">🛒</div>
</div>

<div class="saving" id="savingText"></div>
<div class="bar"><div id="barFill" class="fill"></div></div>

<input class="search" placeholder="Search items..." oninput="searchItems(this.value)">

<div class="cat-wrap">
<div id="cats" class="cat-scroll"></div>
</div>

<div id="items"></div>

<div id="cart" class="cart" onclick="openCart()">
<span id="cartText"></span>
<span>View</span>
</div>

</div>

<!-- SUMMARY -->

<div id="summary" class="page">

<div class="header">
<div onclick="back()">←</div>
<div>Summary</div>
<div></div>
</div>

<div id="summaryItems"></div>

<p>Delivery: ₹<span id="delivery"></span></p>
<p>Total: ₹<span id="total"></span></p>

</div>

<!-- MAP -->

<div id="mapPage" class="page">
<div id="map"></div>
<div class="map-btn" onclick="confirmLocation()">Confirm Location</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* DATA */
let restaurants=[],items=[],categories=[];
let cart={},currentRest="";
let lat=null,lng=null;

/* LOAD */
fetch("https://script.google.com/macros/s/AKfycbw66W91wIe-cAXwIZPgfEGJ1gy4TQ_MQ5WANbm3jQ9g4t_OmKNgqD7K8-pq7njoteWwEg/exec")
.then(r=>r.json())
.then(d=>{
restaurants=d.restaurants;
items=d.items;
categories=d.categories;
renderRestaurants();
});

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}
function back(){show("home")}

/* RESTAURANTS */
function renderRestaurants(){
restList.innerHTML="";
restaurants.forEach(r=>{
restList.innerHTML+=`<div onclick="openMenu('${r.RestaurantID}')" class="item">${r.RestaurantName}</div>`;
});
}

/* MENU */
function openMenu(id){
currentRest=id;
show("menu");

let r=restaurants.find(x=>x.RestaurantID==id);
restName.innerText=r.RestaurantName;

renderMenu();
}

function renderMenu(){

items.innerHTML="";
cats.innerHTML="";

categories.filter(c=>c.RestaurantID==currentRest).forEach(c=>{
cats.innerHTML+=`<div class="cat" onclick="scrollCat('${c.CategoryID}')">${c.CategoryName}</div>`;
});

items.filter(i=>i.RestaurantID==currentRest).forEach(it=>{
items.innerHTML+=`
<div class="item" id="cat-${it.CategoryID}">
${it.ItemName} ₹${it.Price}
<button onclick="add('${it.ItemName}')">+</button>
</div>`;
});

initScrollSpy();
}

/* SCROLL */
function scrollCat(id){
document.getElementById("cat-"+id)?.scrollIntoView({behavior:"smooth"});
}

/* SCROLL SPY */
function initScrollSpy(){
let secs=document.querySelectorAll("[id^='cat-']");
let catsEl=document.querySelectorAll(".cat");

let obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
let id=e.target.id.replace("cat-","");
catsEl.forEach(c=>c.classList.remove("active"));
let el=[...catsEl].find(x=>x.onclick.toString().includes(id));
if(el)el.classList.add("active");
}
});
},{threshold:0.5});

secs.forEach(s=>obs.observe(s));
}

/* CART */
function add(n){
cart[n]=(cart[n]||0)+1;
updateCart();
}

function updateCart(){
let c=0,t=0;
for(let i in cart){
c+=cart[i];
let it=items.find(x=>x.ItemName==i);
t+=it.Price*cart[i];
}
if(c){
cart.style.display="flex";
cartText.innerText=c+" items ₹"+t;
updateSaving(t);
}
}

/* SAVING */
function updateSaving(total){
let target=200;
let remain=target-total;

if(remain>0){
savingText.innerText="Add ₹"+remain+" more to save";
}else{
savingText.innerText="You are saving!";
}

barFill.style.width=Math.min((total/target)*100,100)+"%";
}

/* DELIVERY */
function calcDelivery(){
if(!lat)return 0;

let r=restaurants.find(x=>x.RestaurantID==currentRest);
let d=getDistance(lat,lng,Number(r.Latitude),Number(r.Longitude));
return Math.round(20 + d*10);
}

function getDistance(lat1,lon1,lat2,lon2){
let R=6371;
let dLat=(lat2-lat1)*Math.PI/180;
let dLon=(lon2-lon1)*Math.PI/180;
let a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* SUMMARY */
function openCart(){
show("summary");

let total=0;
for(let i in cart){
let it=items.find(x=>x.ItemName==i);
total+=it.Price*cart[i];
}

let delivery=calcDelivery();

document.getElementById("delivery").innerText=delivery;
document.getElementById("total").innerText=total+delivery;
}

/* SEARCH */
function searchItems(q){
q=q.toLowerCase();
items.innerHTML="";
items.filter(i=>i.RestaurantID==currentRest && i.ItemName.toLowerCase().includes(q))
.forEach(it=>{
items.innerHTML+=`<div class="item">${it.ItemName} ₹${it.Price}</div>`;
});
}

/* MAP */
let map,marker;

function openMap(){
show("mapPage");

map=L.map('map').setView([22.3,70.8],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click',e=>{
if(marker)map.removeLayer(marker);
marker=L.marker(e.latlng).addTo(map);
lat=e.latlng.lat;
lng=e.latlng.lng;
});
}

function confirmLocation(){
if(!lat){alert("Tap on map");return;}
localStorage.setItem("lat",lat);
localStorage.setItem("lng",lng);
locText.innerText="Location ✓";
show("home");
}

</script>

</body>
</html>
