<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>20nagar Food Xpress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e53935">

<style>
:root{
--brand:#e53935;
--bg:#ffffff;
--text:#1e1e1e;
--muted:#6f6f6f;
--border:#e4e4e4;
}

/* RESET */
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#fff}

/* PAGE */
.page{display:none}
.page.active{display:block}

/* HEADER */
.header img{width:100%;max-height:140px;object-fit:cover}

/* SEARCH */
.search-wrap{position:sticky;top:0;background:#fff;padding:10px}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd}

/* RESTAURANT */
.restaurant{padding:14px;border:1px solid #000;margin:10px;border-radius:10px}

/* CATEGORY */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px}
.cat-chip{padding:6px 12px;background:#eee;border-radius:20px}
.cat-chip.active{background:#e53935;color:#fff}

/* ITEM */
.item{display:flex;justify-content:space-between;padding:14px;border:1px solid #000;margin:10px;border-radius:10px}

/* CART */
.cart-bar{
position:fixed;bottom:10px;left:10px;right:10px;
background:#e53935;color:#fff;padding:14px;
border-radius:12px;display:none;justify-content:space-between;
}
</style>

</head>

<body>

<!-- HOME -->

<div id="page-restaurants" class="page active">

<div class="header">
<img src="company-logo.png">
</div>

<div class="search-wrap">
<input class="search" placeholder="Search..." oninput="filterRestaurants(this.value)">
</div>

<div id="restaurantList"></div>

</div>

<!-- MENU -->

<div id="page-menu" class="page">

<div style="padding:10px;font-weight:700" onclick="goBack()">← Back</div>

<div id="menuTitle" style="padding:10px;font-weight:800"></div>

<input class="search" placeholder="Search items..." oninput="searchItems(this.value)">

<div id="catScroll" class="cat-scroll"></div>

<div id="menuItems"></div>

<div id="cartBar" class="cart-bar" onclick="openSummary()">
<span id="cartInfo"></span>
<span>View Cart</span>
</div>

</div>

<script>

/* DATA */
let restaurants=[],items=[],categories=[];
let cart={},currentRestaurant="";
let lat="",lng="",pricedDistanceKm=0;

/* FETCH */
fetch("https://script.google.com/macros/s/AKfycbw66W91wIe-cAXwIZPgfEGJ1gy4TQ_MQ5WANbm3jQ9g4t_OmKNgqD7K8-pq7njoteWwEg/exec")
.then(r=>r.json())
.then(d=>{
restaurants=d.restaurants;
items=d.items;
categories=d.categories;
renderRestaurants();
});

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}
function goBack(){show("page-restaurants")}

/* RESTAURANTS */
function renderRestaurants(){
restaurantList.innerHTML="";
restaurants.forEach(r=>{
restaurantList.innerHTML+=`<div class="restaurant" onclick="openMenu('${r.RestaurantID}')">${r.RestaurantName}</div>`;
});
}

/* MENU */
function openMenu(id){
currentRestaurant=id;
show("page-menu");

let r=restaurants.find(x=>x.RestaurantID==id);
menuTitle.innerText=r.RestaurantName;

renderMenu();
}

/* MENU RENDER */
function renderMenu(){

menuItems.innerHTML="";
catScroll.innerHTML="";

categories.filter(c=>c.RestaurantID==currentRestaurant).forEach(c=>{

catScroll.innerHTML+=`<div class="cat-chip" onclick="scrollCat('${c.CategoryID}')">${c.CategoryName}</div>`;

menuItems.innerHTML+=`<div id="cat-${c.CategoryID}" style="font-weight:800;margin:10px">${c.CategoryName}</div>`;

items.filter(i=>i.RestaurantID==currentRestaurant && i.CategoryID==c.CategoryID).forEach(it=>{

let q=cart[it.ItemName]||0;

menuItems.innerHTML+=`
<div class="item">
<div>${it.ItemName} ₹${it.Price}</div>
<div>
<button onclick="upd('${it.ItemName}',-1)">-</button>
${q}
<button onclick="upd('${it.ItemName}',1)">+</button>
</div>
</div>
`;

});

});

initScrollSpy();
}

/* SCROLL */
function scrollCat(id){
document.getElementById("cat-"+id).scrollIntoView({behavior:"smooth"});
}

/* AUTO HIGHLIGHT */
function initScrollSpy(){
let sections=document.querySelectorAll("[id^='cat-']");
let chips=document.querySelectorAll(".cat-chip");

let obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
let id=e.target.id.replace("cat-","");
chips.forEach(c=>c.classList.remove("active"));
chips.forEach(c=>{
if(c.innerText==e.target.innerText) c.classList.add("active");
});
}
});
},{threshold:0.4});

sections.forEach(s=>obs.observe(s));
}

/* SEARCH */
function searchItems(q){
q=q.toLowerCase();

if(!q){
renderMenu();
return;
}

catScroll.style.display="none";

menuItems.innerHTML="";

items.filter(i=>i.RestaurantID==currentRestaurant && i.ItemName.toLowerCase().includes(q))
.forEach(it=>{
menuItems.innerHTML+=`<div class="item">${it.ItemName} ₹${it.Price}</div>`;
});
}

/* CART */
function upd(name,delta){
cart[name]=(cart[name]||0)+delta;
if(cart[name]<=0) delete cart[name];
updateBar();
renderMenu();
}

function updateBar(){
let c=0,t=0;
for(let i in cart){
c+=cart[i];
let it=items.find(x=>x.ItemName==i);
t+=it.Price*cart[i];
}
if(c){
cartBar.style.display="flex";
cartInfo.innerText=c+" items ₹"+t;
}else{
cartBar.style.display="none";
}
}

</script>

</body>
</html>
