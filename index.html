<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>20nagar Food Xpress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e53935">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root{--brand:#e53935;--border:#e4e4e4}
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#fff}
.page{display:none}.page.active{display:block}

/* HEADER */
.header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;font-weight:700;z-index:1000}

/* OFFER */
.offer{background:#e53935;color:#fff;margin:10px;padding:12px;border-radius:12px;text-align:center;font-weight:700}

/* SEARCH */
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:10px}

/* CATEGORY */
.cat-wrap{position:sticky;top:60px;background:#fff;padding:8px}
.cat-scroll{display:flex;gap:8px;overflow-x:auto}
.cat{padding:6px 12px;background:#eee;border-radius:20px;font-size:13px}
.cat.active{background:var(--brand);color:#fff}

/* ITEM */
.item{display:flex;justify-content:space-between;padding:12px;border:1px solid #ddd;margin:10px;border-radius:12px}

/* CART */
.cart{position:fixed;bottom:10px;left:10px;right:10px;background:#e53935;color:#fff;padding:12px;border-radius:12px;display:none;justify-content:space-between}

/* SAVING */
.saving{text-align:center;font-weight:700}
.bar{height:6px;background:#eee;margin:5px}
.fill{height:100%;background:#e53935;width:0%}

/* MAP */
#map{height:100vh}
.map-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e53935;color:#fff;padding:12px;border-radius:10px}
</style>

</head>

<body>

<!-- HOME -->

<div id="home" class="page active">

<div class="offer">
🔥 Best Price Guaranteed<br>
📉 Save more on bigger orders
</div>

<div onclick="openMap()" style="padding:10px;border:1px solid #ddd;margin:10px;border-radius:10px">
📍 <span id="locText">Set delivery location</span>
</div>

<input class="search" placeholder="Search restaurant..." oninput="filterRestaurants(this.value)">
<div id="restList"></div>
</div>

<!-- MENU -->

<div id="menu" class="page">
<div class="header">
<div onclick="goBack()">←</div>
<div id="restName"></div>
<div onclick="openSummary()">🛒</div>
</div>

<div id="savingText" class="saving"></div>
<div class="bar"><div id="barFill" class="fill"></div></div>

<input class="search" placeholder="Search items..." oninput="searchItems(this.value)">

<div class="cat-wrap"><div id="cats" class="cat-scroll"></div></div>
<div id="items"></div>

<div id="cart" class="cart" onclick="openSummary()">
<span id="cartText"></span><span>View</span>
</div>
</div>

<!-- SUMMARY -->

<div id="summary" class="page">
<div class="header">
<div onclick="goBack()">←</div>
<div>Summary</div>
<div></div>
</div>

<div id="summaryItems"></div>
<p>Delivery: ₹<span id="delivery"></span></p>
<p>Discount: ₹<span id="discount"></span></p>
<p>Total: ₹<span id="total"></span></p>

<button onclick="placeOrder()">Place Order</button>

</div>

<!-- MAP -->

<div id="mapPage" class="page">
<div id="map"></div>
<div class="map-btn" onclick="confirmLocation()">Confirm Location</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* ================= CONFIG ================= */
const WA_NUMBER="91XXXXXXXXXX";   // PUT YOUR NUMBER
const PLATFORM_FEE=5;

/* ================= DATA ================= */
let restaurants=[],items=[],categories=[];
let cart={},currentRest="";
let lat=null,lng=null;

/* ================= FETCH ================= */
fetch("https://script.google.com/macros/s/AKfycbw66W91wIe-cAXwIZPgfEGJ1gy4TQ_MQ5WANbm3jQ9g4t_OmKNgqD7K8-pq7njoteWwEg/exec")
.then(r=>r.json())
.then(d=>{
restaurants=d.restaurants;
items=d.items;
categories=d.categories;
renderRestaurants();

/* LOAD SAVED LOCATION */
let sLat=localStorage.getItem("lat");
let sLng=localStorage.getItem("lng");
if(sLat && sLng){
lat=Number(sLat); lng=Number(sLng);
locText.innerText="Location ✓";
}
});

/* ================= NAV ================= */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}
function goBack(){show("home")}

/* ================= RESTAURANTS ================= */
function renderRestaurants(){
restList.innerHTML="";
restaurants.forEach(r=>{
restList.innerHTML+=`<div class="item" onclick="openMenu('${r.RestaurantID}')">${r.RestaurantName}</div>`;
});
}
function filterRestaurants(q){
q=q.toLowerCase();
restList.innerHTML="";
restaurants.filter(r=>r.RestaurantName.toLowerCase().includes(q))
.forEach(r=>{
restList.innerHTML+=`<div class="item" onclick="openMenu('${r.RestaurantID}')">${r.RestaurantName}</div>`;
});
}

/* ================= MENU ================= */
function openMenu(id){
currentRest=id;
show("menu");

let r=restaurants.find(x=>x.RestaurantID==id);
restName.innerText=r.RestaurantName;

renderMenu();
}

function renderMenu(){
itemsDiv.innerHTML="";
cats.innerHTML="";

categories.filter(c=>c.RestaurantID==currentRest).forEach(c=>{
cats.innerHTML+=`<div class="cat" onclick="scrollCat('${c.CategoryID}')">${c.CategoryName}</div>`;
});

items.filter(i=>i.RestaurantID==currentRest).forEach(it=>{
itemsDiv.innerHTML+=`
<div class="item" id="cat-${it.CategoryID}">
${it.ItemName} ₹${it.Price}
<button onclick="add('${it.ItemName}')">+</button>
</div>`;
});

initScrollSpy();
}

/* ================= SCROLL ================= */
function scrollCat(id){
document.getElementById("cat-"+id)?.scrollIntoView({behavior:"smooth"});
}

/* ================= SCROLL SPY ================= */
function initScrollSpy(){
let secs=document.querySelectorAll("[id^='cat-']");
let catsEl=document.querySelectorAll(".cat");

let obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
let id=e.target.id.replace("cat-","");
catsEl.forEach(c=>c.classList.remove("active"));
let el=[...catsEl].find(x=>x.onclick.toString().includes(id));
if(el)el.classList.add("active");
}
});
},{threshold:0.4});

secs.forEach(s=>obs.observe(s));
}

/* ================= CART ================= */
function add(n){
cart[n]=(cart[n]||0)+1;
updateCart();
}
function updateCart(){
let c=0,t=0;
for(let i in cart){
c+=cart[i];
let it=items.find(x=>x.ItemName==i);
t+=it.Price*cart[i];
}
if(c){
cart.style.display="flex";
cartText.innerText=c+" items ₹"+t;
updateSaving(t);
}
}

/* ================= SAVING ================= */
function updateSaving(total){
let target=200;
let remain=target-total;
savingText.innerText = remain>0 ? "Add ₹"+remain+" more to save" : "You are saving!";
barFill.style.width=Math.min((total/target)*100,100)+"%";
}

/* ================= DELIVERY ================= */
function haversine(lat1,lon1,lat2,lon2){
let R=6371;
let dLat=(lat2-lat1)*Math.PI/180;
let dLon=(lon2-lon1)*Math.PI/180;
let a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcDelivery(){
let r=restaurants.find(x=>x.RestaurantID==currentRest);
let d=haversine(lat,lng,Number(r.Latitude),Number(r.Longitude))*1.5;

if(d>15){ alert("Out of range"); return null; }

if(d<=6.5) return Math.round(20 + d*10);
return Math.round(30 + d*10);
}

/* ================= SUMMARY ================= */
function openSummary(){
if(!lat){alert("Set location");return;}
show("summary");

let total=0;
summaryItems.innerHTML="";

for(let i in cart){
let it=items.find(x=>x.ItemName==i);
total+=it.Price*cart[i];
summaryItems.innerHTML+=`<div>${i} x ${cart[i]}</div>`;
}

let delivery=calcDelivery();
if(delivery===null) return;

let discount=Math.floor(total/200)*10;

deliveryEl.innerText=delivery;
discountEl.innerText=discount;
totalEl.innerText=total+delivery-discount+PLATFORM_FEE;
}

/* ================= ORDER ================= */
function placeOrder(){
let msg="Order:%0A";
for(let i in cart){ msg+=i+" x "+cart[i]+"%0A"; }
msg+="Location: https://maps.google.com/?q="+lat+","+lng;

window.open("https://wa.me/"+WA_NUMBER+"?text="+msg);
}

/* ================= MAP ================= */
let map,marker;

function openMap(){
show("mapPage");

map=L.map('map').setView([22.3,70.8],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click',e=>{
if(marker)map.removeLayer(marker);
marker=L.marker(e.latlng).addTo(map);
lat=e.latlng.lat;
lng=e.latlng.lng;
});
}

function confirmLocation(){
if(!lat){alert("Tap map");return;}
localStorage.setItem("lat",lat);
localStorage.setItem("lng",lng);
locText.innerText="Location ✓";
show("home");
}

</script>

</body>
</html>
